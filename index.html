<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book donation form</title>
</head>

<body>
    <fieldset>
        <legend>
            <h1>Book Donation Form</h1>
        </legend>
        <h2>Donate the money for book which you like!</h2>
    </fieldset>
    <br>
    <fieldset>
        <legend>personal information</legend>
        <label>your name</label><br>
        <input type="text" id="name" placeholder="Enter your full name"><br><br>
        <label>set your password</label><br>
        <input type="password" id="password" placeholder="enter a strong password"><br><br>
        <label>Date of birth</label><br>
        <input type="date" id="date">
    </fieldset><br>
    <fieldset>
        <label>Select the name of the book which you want to donate!</label>
        <select id="book">
            <option value="">--select a book--</option>
            <option value="ramayan">--ramayan--</option>
            <option value="Mahabharat">--Mahabharat--</option>
            <option value="Can be stranger's again">--can be stranger's again--</option>
            <option value="Born again on the mountain">--Born again on the mountain--</option>
            <option value="One piece">--One piece--</option>
            <option value="Jujutsukaisan">--Jujutsukaisan--</option>
            <option value="Naruto">--Naruto--</option>
            </section><br><br>
    </fieldset>
</body>

</html>
